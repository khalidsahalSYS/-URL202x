name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Detect Android Gradle project
        id: detect
        shell: bash
        run: |
          if [[ -f ./gradlew ]]; then
            echo "has_project=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_project=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No Android Gradle project or Gradle wrapper found. This repository currently contains documentation only, so no APK can be built."
          fi

      - name: Set up Java
        if: steps.detect.outputs.has_project == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Make Gradle wrapper executable
        if: steps.detect.outputs.has_project == 'true'
        run: chmod +x ./gradlew

      - name: Build debug APK
        if: steps.detect.outputs.has_project == 'true'
        run: ./gradlew assembleDebug

      - name: Upload debug APK
        if: steps.detect.outputs.has_project == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
